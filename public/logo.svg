<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="#341a75" stroke="white" stroke-width="5"/>

  <!-- Inner circle for contrast -->
  <circle cx="100" cy="100" r="90" fill="#341a75"/>

  <!-- Text background -->
  <g>
    <!-- Alberti (white) -->
    <text x="100" y="85" font-family="Playfair Display, serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">
      Alberti
    </text>

    <!-- Home Buyers (blue/cyan) -->
    <text x="100" y="115" font-family="Open Sans, sans-serif" font-size="16" font-weight="600" fill="#44d1ff" text-anchor="middle" letter-spacing="0.5">
      Home Buyers
    </text>

    <!-- Small box icon (orange) -->
    <rect x="130" y="100" width="16" height="16" fill="#e37800" rx="2"/>
  </g>
</svg>
